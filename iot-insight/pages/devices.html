<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="IoT Insight industrial monitoring and analytics platform"><title>Devices | IoT Insight</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/responsive.css"></head><body><script src="../js/components.js"></script><script src="../js/api-service.js"></script><script src="../js/charts.js"></script><script>const c=mountPage('Devices',`<div class="page-heading"><div><div class="eyebrow">Inventory</div><h2>Devices</h2><p class="muted">Manage industrial devices without creating demo records.</p></div><button class="btn btn-primary" onclick="openModal('deviceModal')">＋ Add Device</button></div><div class="card"><div class="card-header"><div><div class="card-title">Device Registry</div><div class="muted">No persistent devices are created by this frontend.</div></div></div><div class="table-wrap"><table><thead><tr><th>Device Name</th><th>Device ID</th><th>Status</th><th>Parameters</th><th>Last Reading</th><th>Last Seen</th><th>Actions</th></tr></thead><tbody><tr><td colspan="7">${emptyState('No devices connected yet','Use Add Device to prepare a configuration. It is not persisted until a backend is connected.')}</td></tr></tbody></table></div></div><div class="modal-backdrop" id="deviceModal"><div class="modal"><div class="card-header"><div><div class="card-title">Add Device</div><div class="muted">Configuration only — no backend persistence yet.</div></div><button class="close" onclick="closeModal('deviceModal')">×</button></div><form class="card-body" id="deviceForm"><div class="form-grid"><div class="form-group"><label>Device Name</label><input required placeholder="Enter device name"></div><div class="form-group"><label>Device ID</label><input required placeholder="Enter unique device ID"></div><div class="form-group full"><label>Description</label><textarea placeholder="Optional description"></textarea></div><div class="form-group"><label>Location</label><input placeholder="Enter location"></div><div class="form-group"><label>Status</label><select><option>Connected</option><option>Offline</option><option>Maintenance</option></select></div></div><div class="form-actions"><button type="button" class="btn btn-secondary" onclick="closeModal('deviceModal')">Cancel</button><button class="btn btn-primary">Save Configuration</button></div><p class="notice" style="margin-top:12px">Frontend-only mode: this form does not create a persistent device or send data to a server.</p></form></div></div>`);document.getElementById('deviceForm').addEventListener('submit',e=>{e.preventDefault();alert('Configuration captured locally only. Connect FastAPI to persist devices.');closeModal('deviceModal')});</script></body></html>
