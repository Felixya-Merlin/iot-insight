<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="IoT Insight industrial monitoring and analytics platform"><title>Device Details | IoT Insight</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/responsive.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body><script src="../js/components.js"></script><script src="../js/api-service.js"></script><script src="../js/charts.js"></script><script>const c=mountPage('Device Details',`<div class="page-heading"><div><div class="eyebrow">Device Workspace</div><h2>Device Details</h2><p class="muted">Select a device from the future backend to populate this view.</p></div><span class="status status-wait"><span class="status-dot"></span>No Device Selected</span></div><div class="grid grid-2"><div class="card"><div class="card-header"><div class="card-title">Device Information</div></div>${emptyState('No device selected','Device name, ID, description, location, and connection status will appear here.')}</div><div class="card"><div class="card-header"><div class="card-title">Parameters</div></div>${emptyState('No parameters configured','Parameter definitions will appear here after a device is configured.')}</div></div><div class="section-gap">${chartCard('historyChart','Reading History','Reading history will appear here when sensor readings are received.')}</div><div class="grid grid-3 section-gap"><div class="analysis-box"><h3>Statistics</h3>${emptyState('No statistics available','Statistics require historical readings.')}</div><div class="analysis-box"><h3>Trend</h3>${emptyState('No trend available','Trend analysis requires historical readings.')}</div><div class="analysis-box"><h3>Rate of Change</h3>${emptyState('No rate available','Rate of change requires timestamped readings.')}</div><div class="analysis-box"><h3>Moving Average</h3>${emptyState('No moving average','Moving average requires a sequence of readings.')}</div><div class="analysis-box"><h3>Anomalies</h3>${emptyState('No anomalies available','Anomaly detection will run after readings are available.')}</div></div>`);</script></body></html>
