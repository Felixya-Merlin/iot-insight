<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="IoT Insight industrial monitoring and analytics platform"><title>Alerts | IoT Insight</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/responsive.css"></head><body><script src="../js/components.js"></script><script src="../js/api-service.js"></script><script src="../js/charts.js"></script><script>const c=mountPage('Alerts',`<div class="page-heading"><div><div class="eyebrow">Events</div><h2>Alerts</h2><p class="muted">Only real backend-generated alerts will be shown.</p></div></div><div class="grid grid-4"><div class="card summary-card"><span class="summary-label">Total Alerts</span><strong class="summary-value">0</strong><span class="summary-note">No alerts</span></div><div class="card summary-card"><span class="summary-label">Critical</span><strong class="summary-value">0</strong><span class="summary-note">No critical alerts</span></div><div class="card summary-card"><span class="summary-label">Warning</span><strong class="summary-value">0</strong><span class="summary-note">No warning alerts</span></div><div class="card summary-card"><span class="summary-label">Resolved</span><strong class="summary-value">0</strong><span class="summary-note">No resolved alerts</span></div></div><div class="card section-gap"><div class="card-header"><div class="toolbar" style="width:100%"><div class="card-title">Alert Log</div><div class="filters"><button class="filter-btn active">All</button><button class="filter-btn">Warning</button><button class="filter-btn">Critical</button><button class="filter-btn">Resolved</button></div></div></div>${emptyState('No alerts','Alerts will appear here when real readings exceed configured thresholds or anomaly rules are triggered.')}</div>`);document.querySelectorAll('.filter-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active')});</script></body></html>
