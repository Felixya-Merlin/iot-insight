<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="IoT Insight industrial monitoring and analytics platform"><title>Analysis | IoT Insight</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/responsive.css"></head><body><script src="../js/components.js"></script><script src="../js/api-service.js"></script><script src="../js/charts.js"></script><script>const c=mountPage('Analysis',`<div class="page-heading"><div><div class="eyebrow">Analytics</div><h2>Analysis</h2><p class="muted">Analytics remain empty until real timestamped readings are available.</p></div></div><div class="card"><div class="card-header"><div class="card-title">Historical Analysis</div></div><div class="card-body"><div class="filters"><button class="filter-btn active">Today</button><button class="filter-btn">Last 24 Hours</button><button class="filter-btn">Last 7 Days</button><button class="filter-btn">Last 30 Days</button><button class="filter-btn">Custom Range</button></div></div></div><div class="grid grid-3 section-gap"><div class="analysis-box"><h3>Statistical Analysis</h3><div class="metric-list"><div class="metric"><span>Minimum</span><strong>—</strong></div><div class="metric"><span>Maximum</span><strong>—</strong></div><div class="metric"><span>Average</span><strong>—</strong></div><div class="metric"><span>Median</span><strong>—</strong></div><div class="metric"><span>Std. Deviation</span><strong>—</strong></div></div></div><div class="analysis-box"><h3>Trend Analysis</h3>${emptyState('No analysis available','Increasing, decreasing, or stable trends require real readings.')}</div><div class="analysis-box"><h3>Rate of Change</h3>${emptyState('No analysis available','Timestamped readings are required.')}</div><div class="analysis-box"><h3>Moving Average</h3>${emptyState('No analysis available','A reading sequence is required.')}</div><div class="analysis-box"><h3>Threshold Analysis</h3>${emptyState('No analysis available','Threshold comparison starts after parameter limits and readings exist.')}</div><div class="analysis-box"><h3>Anomaly Detection</h3>${emptyState('No analysis available','Anomaly detection requires real historical readings.')}</div></div>`);document.querySelectorAll('.filter-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active')});</script></body></html>
