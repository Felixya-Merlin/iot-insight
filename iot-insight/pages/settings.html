<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="IoT Insight industrial monitoring and analytics platform"><title>Settings | IoT Insight</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/responsive.css"></head><body><script src="../js/components.js"></script><script src="../js/api-service.js"></script><script src="../js/charts.js"></script><script>const c=mountPage('Settings',`<div class="page-heading"><div><div class="eyebrow">Configuration</div><h2>Settings</h2><p class="muted">Frontend preferences only; backend secrets are never stored here.</p></div></div><div class="card"><div class="card-header"><div><div class="card-title">Application Settings</div><div class="muted">General application configuration.</div></div></div><div class="card-body"><div class="form-grid"><div class="form-group"><label>Application Name</label><input value="IoT Insight"></div><div class="form-group"><label>Time Zone</label><select><option>India Standard Time (IST)</option><option>UTC</option></select></div><div class="form-group"><label>Date Format</label><select><option>DD-MM-YYYY</option><option>YYYY-MM-DD</option><option>MM-DD-YYYY</option></select></div></div></div></div><div class="card section-gap"><div class="card-header"><div><div class="card-title">Threshold Settings</div><div class="muted">Default behavior is configured per parameter.</div></div></div><div class="card-body"><div class="notice">Threshold values should be configured for individual parameters from the Parameters page. No threshold is assumed until the professor provides the actual sensor specification.</div></div></div><div class="card section-gap"><div class="card-header"><div><div class="card-title">Notification Settings</div><div class="muted">Preferences are ready for future alert events.</div></div></div><div class="card-body"><div class="toggle-row"><div><strong>Alert Notifications</strong><div class="muted">Notify when a configured alert is raised.</div></div><button class="toggle" aria-label="Alert Notifications"></button></div><div class="toggle-row"><div><strong>Anomaly Notifications</strong><div class="muted">Notify when anomaly detection identifies an event.</div></div><button class="toggle" aria-label="Anomaly Notifications"></button></div><div class="toggle-row"><div><strong>Device Offline Notifications</strong><div class="muted">Notify when a connected device becomes unavailable.</div></div><button class="toggle" aria-label="Device Offline Notifications"></button></div></div></div>`);document.querySelectorAll('.toggle').forEach(t=>t.onclick=()=>t.classList.toggle('on'));</script></body></html>
