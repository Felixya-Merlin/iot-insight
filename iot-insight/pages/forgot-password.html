<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | IoT Insight</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>
    <div class="auth-page">
        <div class="stars"></div>
        <div class="mountains mountain-back"></div>
        <div class="mountains mountain-front"></div>
        <div class="moon"></div>

        <header class="auth-header">
            <div class="logo">IoT<span>Insight</span></div>
            
            <div class="status">
                <span></span>
                System Online
            </div>
        </header>

        <main class="auth-container">
            <div class="glass-card">
                <div class="card-header">
                    <div class="small-title">ACCOUNT RECOVERY</div>
                    <h1>Reset Password</h1>
                    <p>Enter your email to receive a secure password reset link.</p>
                </div>

                <form id="forgotPasswordForm">
                    <div class="input-group">
                        <label for="forgotPasswordEmail">Email Address</label>
                        <div class="input-wrapper">
                            <span class="input-icon">✉</span>
                            <input type="email" id="forgotPasswordEmail" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <button type="submit" class="auth-button" id="forgotPasswordButton">Send Reset Link</button>
                    <div class="message" id="forgotPasswordMessage"></div>
                </form>

                <div class="divider"><span>OR</span></div>

                <div class="signup-link">
                    <a href="../index.html">Back to Sign In</a>
                </div>
            </div>
        </main>

        <footer class="auth-footer">
            <span>IoT Insight</span>
            <span>•</span>
            <span>Secure Access</span>
            <span>•</span>
            <span>Analytics Platform</span>
        </footer>
    </div>

    <script type="module" src="../js/auth.js"></script>
</body>
</html>
